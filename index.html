<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruby Concurrency Simulator</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header id="hdr">
    <div class="logo">● Ruby Concurrency</div>
    <div class="stat"><div class="stat-label">Money</div><div class="stat-value" id="hdr-money">$0</div></div>
    <div class="stat"><div class="stat-label">GVL wait</div><div class="stat-value" id="hdr-gvl" style="color:#9371e6">—</div></div>
    <div class="stat"><div class="stat-label">Req / min</div><div class="stat-value" id="hdr-rps" style="color:#3fb950">—</div></div>
    <div class="stat"><div class="stat-label">Incoming / min</div><div class="stat-value" id="hdr-incoming" style="color:#58a6ff">—</div></div>
    <button id="pause-btn" class="pause-btn" title="Pause (Space)">⏸ Pause</button>
  </header>

  <div class="game-layout">
    <!-- Left: incoming queue (HTML) -->
    <div class="side-panel" id="queue-panel">
      <div class="panel-title">Incoming requests</div>
      <div id="queue-list"></div>
    </div>

    <!-- Center: threads + monitor -->
    <div id="game-container" style="position:relative">
      <div id="pause-overlay" style="display:none"><div class="pause-badge">⏸ PAUSED — press Space to resume</div></div>
      <div id="threads-area"><div id="threads-inner"></div></div>
      <div id="monitor-area" style="display:none">
        <div id="monitor-resize-handle"><span>Monitoring</span></div>
        <div id="monitor-canvas-wrap"></div>
      </div>
    </div>

    <!-- Right: shop (HTML) -->
    <div class="side-panel" id="info-panel">
      <div class="panel-title">Shop</div>
      <div id="shop"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
